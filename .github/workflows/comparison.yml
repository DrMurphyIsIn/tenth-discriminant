# Re-run the fourth entry's computations (comparison/) from a clean checkout and compare every output with the recorded one
# in comparison/results/, byte for byte: the four band certificates of the theorem (Arb ball arithmetic), the finite range
# below 565, and the survey scripts that need no third-party files. NOT a kernel check: see comparison/README.md.
name: comparison

on:
  push:
    paths:
      - "comparison/**"
      - ".github/workflows/comparison.yml"
  pull_request:
    paths:
      - "comparison/**"
      - ".github/workflows/comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: comparison
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check every file against MANIFEST.md5
        run: md5sum -c --quiet MANIFEST.md5

      - name: Install python-flint 0.6.0 and mpmath 1.3.0
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet python-flint==0.6.0 mpmath==1.3.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: The four bands [565, 652]
        run: python3 code/own_cert_all.py | tee "$RUNNER_TEMP/own_cert_all.out" && cmp "$RUNNER_TEMP/own_cert_all.out" results/own_cert_all.out

      - name: The finite range below 565
        run: python3 code/finite_below_565.py | tee "$RUNNER_TEMP/finite.out" && cmp "$RUNNER_TEMP/finite.out" results/finite_below_565.out

      - name: The survey's Arb rows (edge form, zero forcing, GRH, the sigma0 curve)
        run: |
          for s in rcs_edge rcs_zero rcs_grh rcs_curve; do
            python3 "survey/$s.py" > "$RUNNER_TEMP/$s.out"
            cmp "$RUNNER_TEMP/$s.out" "results/survey/$s.out" && echo "$s: identical"
          done
