# Build the determinant proof (determinant/formalization) from a clean checkout and check the axioms
# of its main theorem. Mathlib and its pinned dependencies are cloned from git at the revisions in
# lake-manifest.json, and Mathlib's compiled files come from Mathlib's official build cache.
name: determinant proof

on:
  push:
    paths:
      - "determinant/formalization/**"
      - "determinant/certificates/**"
      - ".github/workflows/determinant.yml"
  pull_request:
    paths:
      - "determinant/formalization/**"
      - "determinant/certificates/**"
      - ".github/workflows/determinant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: determinant/formalization
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Self-test the check scripts on their fixtures
        run: scripts/test_checks.sh

      - name: Regenerate the sieve chunks and compare them byte for byte
        run: ../certificates/regenerate_and_diff.sh

      - name: Install elan (v4.2.4, checksum-pinned)
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          rm elan-init elan.tar.gz
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: |
          cat lean-toolchain
          lean --version
          lake --version

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Build ELEM, CN1 and CN1Challenges
        run: |
          set -o pipefail
          lake build ELEM CN1 CN1Challenges 2>&1 | tee build.log

      - name: Exactly one sorry, the challenge statement's
        run: scripts/check_no_sorry.sh build.log

      - name: Axioms of CN1.classNumber_eq_one_iff (importing ELEM.Main only)
        run: |
          set -o pipefail
          # The only project import is ELEM.Main. Never add CN1Challenges or ELEMNegControls here:
          # they declare the same theorem name, and #print axioms would then be unreliable.
          printf 'import ELEM.Main\n\n#print axioms CN1.classNumber_eq_one_iff\n' > AxiomCheck.lean
          lake env lean AxiomCheck.lean > axioms.out 2>&1
          cat axioms.out
          scripts/check_axioms.sh axioms.out

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: determinant-logs
          path: |
            determinant/formalization/build.log
            determinant/formalization/axioms.out
          if-no-files-found: ignore
